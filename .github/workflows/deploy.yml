# Publica el sitio en GitHub Pages en cada push a `main`.
#
# Se usa el flujo nativo de Pages (`actions/deploy-pages`) y no una rama
# `gh-pages`: no hay artefactos compilados en el historial del repositorio, y el
# despliegue queda atado a un commit concreto en lugar de a un push manual.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Permite lanzarlo a mano desde la pestaña Actions, útil tras cambiar una
  # variable de entorno sin tocar el código.
  workflow_dispatch:

# El token solo necesita leer el repositorio y escribir en Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez. `cancel-in-progress: false` deja terminar el que ya
# está corriendo: cancelarlo a la mitad puede dejar el sitio publicado a medias.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` y no `npm install`: instala exactamente lo del package-lock,
      # así la build de producción no estrena una versión que nadie probó.
      - run: npm ci

      - run: npm run build
        env:
          PUBLIC_FORM_ENDPOINT: ${{ vars.PUBLIC_FORM_ENDPOINT }}
          PUBLIC_FORM_ACCESS_KEY: ${{ vars.PUBLIC_FORM_ACCESS_KEY }}
          # PUBLIC_CONTACT_EMAIL deliberadamente NO se inyecta.
          #
          # Publicar una dirección personal en un sitio corporativo la expone a
          # los rastreadores de correo, y aquí era `emena@…`, un buzón de
          # persona y no de empresa. Sin esta variable, la página de contacto no
          # imprime ningún correo y el aviso de privacidad enlaza el formulario.
          #
          # Se apaga aquí, y no borrando la variable en GitHub, para que el
          # motivo quede escrito y versionado: quien la vuelva a definir en los
          # ajustes del repositorio no entendería por qué dejó de salir.
          #
          # Para volver a publicar un correo —conviene que sea de rol,
          # `contacto@forcelis-group.com`, no personal— basta con descomentar la
          # línea siguiente y definir la variable.
          # PUBLIC_CONTACT_EMAIL: ${{ vars.PUBLIC_CONTACT_EMAIL }}
          PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}
          PUBLIC_CLARITY_ID: ${{ vars.PUBLIC_CLARITY_ID }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
